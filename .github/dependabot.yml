version: 2
updates:
  # Every action is pinned to a commit SHA with its version in a comment.
  # Dependabot reads that comment, proposes the next release, and rewrites the
  # SHA and the comment together, so a pin moves only by PR. yggdrasil's
  # modules are pinned here too.
  #
  # Each release waits three days before it is proposed, because a patch or
  # minor merges itself (dependabot-auto-merge.yml) and every yggdrasil
  # release bakes three days before its consumers take it (yggdrasil's
  # record 0023). Security updates don't wait. Daily, so a release arrives
  # three days after it ships rather than up to ten. zizmor's pedantic audit
  # asks for seven; record 0023 sets three.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3 # zizmor: ignore[dependabot-cooldown]

  # The Python base image, pinned by tag and digest. A digest-only update
  # waits for TJ; a new Python patch or minor merges itself once the PR's
  # image builds, scans clean and passes its smoke test.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3 # zizmor: ignore[dependabot-cooldown]
