name: PR Title

# The PR title becomes the squash commit's title, and the release reads its
# version bump from it. yggdrasil's pr-title module refuses a title that isn't
# `type(scope): summary`. Renovate's titles (`chore(deps): ...`) already
# pass.
#
# A workflow of its own, because it has to run when only the title changes
# (`edited`). `synchronize` stays in the list because a check reports against
# the head commit.
#
# Branch protection requires `PR Title / PR Title` (this job's name, then the
# module's); renaming either strands PRs on a check that never reports.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions: {}

jobs:
  title:
    name: PR Title
    uses: zimmertr/yggdrasil/.github/workflows/pr-title.yml@f805e7b874e54e661d8dc8ad528883228bfc567b # v1.2.9
    permissions:
      pull-requests: read # the action reads the PR's current title from the API
