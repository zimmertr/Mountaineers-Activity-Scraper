name: PR Checks

# The image a PR would ship, through yggdrasil's docker-build module: hadolint,
# the linux/amd64 image built but not pushed, a Trivy table in a sticky
# comment, container-structure-test with tests/structure-test.yaml, then a
# failure on any fixable Critical or High, as the release would refuse.
#
# Branch protection requires `Docker Build / Docker Build
# (zimmertr/mountaineers-activity-scraper)` (this job's name, then the
# module's, with the image) and `Dependency Review / Dependency Review`;
# renaming either strands PRs on a check that never reports.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  docker-build:
    name: Docker Build
    uses: zimmertr/yggdrasil/.github/workflows/docker-build.yml@2581d736b8cbff87c94c055f985062a73cffdccb # v3.1.3
    permissions:
      contents: read # the module checks out the repo
      pull-requests: write # the sticky scan comment
    with:
      # The release's image, with what only a built image shows: the entry
      # point starts and every dependency imports on the image's own Python.
      images: '[{"image": "zimmertr/mountaineers-activity-scraper", "structure-test": "tests/structure-test.yaml"}]'

  # A PR that adds a package version with a known High or Critical
  # vulnerability fails.
  dependency-review:
    name: Dependency Review
    uses: zimmertr/yggdrasil/.github/workflows/dependency-review.yml@2581d736b8cbff87c94c055f985062a73cffdccb # v3.1.3
    permissions:
      contents: read
