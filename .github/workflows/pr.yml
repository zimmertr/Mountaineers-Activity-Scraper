name: PR Checks

# The image a PR would ship, through yggdrasil's docker-build module: hadolint,
# the linux/amd64 image built but not pushed, a Trivy table in a sticky
# comment, container-structure-test with tests/structure-test.yaml, then a
# failure on any fixable Critical or High, as the release would refuse.
#
# Branch protection requires `Docker Build / Docker Build` (this job's name,
# then the module's); renaming either strands PRs on a check that never
# reports.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  docker-build:
    name: Docker Build
    uses: zimmertr/yggdrasil/.github/workflows/docker-build.yml@b662606e82d2291ac62c0ea9b28d3990f575f980 # v1.3.0
    permissions:
      contents: read # the module checks out the repo
      pull-requests: write # the sticky scan comment
    with:
      # What only a built image shows: the entry point starts and every
      # dependency imports on the image's own Python.
      structure-test: tests/structure-test.yaml
