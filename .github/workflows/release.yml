name: Release

# Every merge to main cuts a release through yggdrasil's release module.
# GitVersion reads the bump from the squash commit's title, the image is pushed
# to GHCR under that version and scanned, the commit is tagged and
# released, then a self-merging Kubernetes-Manifests PR points the CronJob at
# it. On a PR the same job runs as a dry run: the job summary says what the
# merge will release, and nothing is pushed.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# One release at a time, so two quick merges can't race on the manifest bump;
# cancel-in-progress stays false so every merge still releases, in order. Each
# PR's dry run gets its own group.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    uses: zimmertr/yggdrasil/.github/workflows/release.yml@667ac9372b2be9ed09b67c2da14f6fbd93e2b1b3 # v1.0.0
    # GitHub refuses to start the run unless the caller grants what the module's
    # tag job asks for, even on a dry run, which never uses it.
    permissions:
      contents: write # the tag and release
      packages: write # the image, pushed to ghcr.io/zimmertr/mountaineers-activity-scraper
    with:
      dry-run: ${{ github.event_name == 'pull_request' }}
      # linux/amd64 only: the cluster is amd64.
      images: '[{"image": "zimmertr/mountaineers-activity-scraper"}]'
      # The fixed branch and title keep one open bump PR across releases.
      deploys: >-
        [{"repo": "zimmertr/Kubernetes-Manifests",
          "file": "misc/mountaineers-activity-scraper/kustomization.yml",
          "set": "(.images[] | select(.name == \"zimmertr/mountaineers-activity-scraper\")).newTag",
          "image": "ghcr.io/zimmertr/mountaineers-activity-scraper",
          "digest-set": "(.images[] | select(.name == \"zimmertr/mountaineers-activity-scraper\")).digest",
          "branch": "chore/mountaineers-activity-scraper-image",
          "title": "chore(mountaineers-activity-scraper): bump mountaineers-activity-scraper"}]
    secrets:
      # Contents and pull-requests write on Kubernetes-Manifests.
      deploy-token: ${{ secrets.GH_PAT }}
